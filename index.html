<!DOCTYPE html>
<html lang="mk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Дарко &amp; Љубица</title>
    <meta name="description" content="Darko and Ljubica. 17 Октомври 2026. Porta Jazz, Bitola." />
    <meta property="og:title" content="Darko & Ljubica" />
    <meta property="og:description" content="17 Октомври 2026 · Porta Jazz, Bitola" />
    <meta property="og:image" content="assets/images/us.jpg" />
    <meta name="theme-color" content="#1f1c19" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect fill='%231f1c19' width='64' height='64'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='18' fill='%23f7f4ef' font-family='Georgia'%3ED%26L%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="disco-layer" id="disco-layer" aria-hidden="true"></div>
    <header class="site-header">
      <span class="brand" data-bind="couple.monogram">Д &amp; Љ</span>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="mk" aria-pressed="true">МК</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </header>

    <main>
      <section class="card" aria-label="Invitation">
        <h1 class="names">
          <span data-bind="couple.partner1">Дарко</span>
          <span class="amp">&amp;</span>
          <span data-bind="couple.partner2">Љубица</span>
        </h1>

        <figure class="photo is-empty" id="us-photo">
          <img id="us-img" alt="Дарко и Љубица" />
        </figure>

        <p class="when" data-bind-i18n="dateDisplay"></p>
        <p class="time" data-bind-i18n="timeDisplay"></p>
        <p class="where">
          <span data-bind-i18n="venueName"></span>
        </p>
        <p class="address" data-bind-i18n="venueAddress"></p>
        <p>
          <a class="maps" id="maps-link" target="_blank" rel="noopener noreferrer" data-i18n="place.maps">Мапа</a>
        </p>
      </section>

      <section class="rsvp" id="rsvp">
        <h2 id="rsvp-title" data-i18n="rsvp.title">Дали ќе присуствувате?</h2>

        <form class="form" id="rsvp-form" novalidate>
          <fieldset aria-labelledby="rsvp-title">
            <div class="choice-row">
              <label class="choice">
                <input type="radio" name="attending" value="yes" required />
                <span data-i18n="rsvp.yes">Да</span>
              </label>
              <label class="choice">
                <input type="radio" name="attending" value="no" />
                <span data-i18n="rsvp.no">Не</span>
              </label>
            </div>
          </fieldset>
          <div class="field">
            <label for="name" data-i18n="rsvp.name">Име и презиме</label>
            <input id="name" name="name" type="text" autocomplete="name" required />
          </div>
          <div class="field">
            <label for="song">
              <span data-i18n="rsvp.song">Песна која ќе ве натера да играте?</span>
              <span class="optional" data-i18n="rsvp.optional">
            </label>
            <input id="song" name="song" type="text" autocomplete="off" />
          </div>
          <p class="form-error" id="form-error" role="alert"></p>
          <button class="btn" type="submit" id="submit-btn" data-i18n="rsvp.submit">Испрати</button>
        </form>

        <div class="rsvp-success" id="rsvp-success" hidden>
          <p id="success-copy"></p>
        </div>
      </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
